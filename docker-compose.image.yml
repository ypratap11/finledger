# Image-based compose: pulls published GHCR images instead of building locally.
# Run with:  docker compose -f docker-compose.image.yml up
# Then open: http://localhost:8003
#
# This is the fastest way to try FinLedger — no clone, no Python toolchain.
# Use docker-compose.full.yml when iterating on the code.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger
      POSTGRES_DB: finledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finledger"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata-image:/var/lib/postgresql/data

  core:
    image: ghcr.io/ypratap11/finledger/core:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://finledger:finledger@postgres:5432/finledger
      TEST_DATABASE_URL: postgresql+asyncpg://finledger:finledger@postgres:5432/finledger
    ports:
      - "8003:8000"
    command: >
      sh -c "alembic upgrade head &&
             python seed_demo.py || true &&
             python seed_revrec_demo.py || true &&
             uvicorn finledger.ui.app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata-image:
